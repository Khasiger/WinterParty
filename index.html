<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Flyer</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header img{
    width:100%;
    display:block;
}

h2{
    text-align:center;
    margin:40px 0 20px;
}

.galeria{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    padding:20px;
}

.galeria img{
    width:100%;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

</style>

</head>

<body>

<header>
    <img src="flyer.png" alt="Flyer">
</header>

<h2>Más fotos</h2>

<div class="galeria">

<img src="foto1.jpg">
<img src="foto2.jpg">
<img src="foto3.jpg">
<img src="foto4.jpg">

</div>

</body>
</html>
