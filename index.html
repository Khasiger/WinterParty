<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WinterParty</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

    <style>

        body{
            margin:0;
            background:#000;
            color:white;
            font-family:'Cinzel', serif;
        }

        header img{
            display:block;
            width:100%;
            height:auto;
        }

        h2{
            text-align:center;
            margin:60px 0 30px;
            font-size:32px;
            font-weight:700;
            letter-spacing:5px;
            color:#c58b45;
            text-shadow:
                0 0 6px rgba(255,210,140,.15),
                0 0 12px rgba(197,139,69,.25);
        }

        .galeria{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            padding:20px;
            max-width:1200px;
            margin:auto;
        }

        .galeria img{
            width:100%;
            display:block;
            border-radius:12px;
            border:2px solid #5a0000;
            box-shadow:0 0 20px rgba(255,0,0,.20);
            transition:0.3s;
        }

        .galeria img:hover{
            transform:scale(1.03);
            box-shadow:0 0 30px rgba(255,0,0,.45);
        }

    </style>

</head>

<body>

<header>
    <img src="flyer.png" alt="Flyer">
</header>

<h2>Inspiración</h2>

<div class="galeria">

    <img src="foto1.jpg" alt="">
    <img src="foto2.jpg" alt="">
    <img src="foto3.jpg" alt="">
    <img src="foto4.jpg" alt="">

</div>

</body>

</html>
